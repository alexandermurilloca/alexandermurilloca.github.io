# Jekyll Configuration — alexandermurilloca.github.io
title: "Marlon A. Murillo Medina"
description: "Gestionnaire de projets TI et d'infrastructure | Cybersécurité | Administrateur réseaux et serveurs | Instructeur Cisco — Sherbrooke, Québec"
url: "https://alexandermurilloca.github.io"
author:
  name: "Marlon Alexander Murillo Medina"
  email: "alexander.murillo.ca@gmail.com"

# Theme
theme: minima

# Language
lang: fr

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Navigation
header_pages:
  - research/README.md

# Publish security.txt (dot-folders are skipped by default)
include:
  - .well-known

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
